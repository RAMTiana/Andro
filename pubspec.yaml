name: budget_app
description: Budget simple, hors-ligne, avec lecture des SMS Mobile Money.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  provider: ^6.1.2
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  path_provider: ^2.1.6
  share_plus: ^10.1.4
  file_picker: ^10.3.7
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sms_rules.json